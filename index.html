    );

    // ==========================================
    // 2. PROCESS COLOR PALETTE
    // ==========================================
    const PROCESS_COLORS = [
      { bg: '#3b82f6', border: '#2563eb', name: 'Blue' },
      { bg: '#10b981', border: '#059669', name: 'Emerald' },
      { bg: '#f59e0b', border: '#d97706', name: 'Amber' },
      { bg: '#ec4899', border: '#db2777', name: 'Pink' },
      { bg: '#8b5cf6', border: '#7c3aed', name: 'Purple' },
      { bg: '#06b6d4', border: '#0891b2', name: 'Cyan' },
      { bg: '#f97316', border: '#ea580c', name: 'Orange' },
      { bg: '#14b8a6', border: '#0d9488', name: 'Teal' },
      { bg: '#a855f7', border: '#9333ea', name: 'Violet' },
      { bg: '#ef4444', border: '#dc2626', name: 'Red' },
    ];
    function getProcColor(idx) {
      return PROCESS_COLORS[idx % PROCESS_COLORS.length];
    }

    // ==========================================
    // 3. SAMPLE DATASETS
    // ==========================================
    const SAMPLE_DATASETS = [
      {
        id: 'standard-benchmark',
        name: 'Standard Benchmark (Section 11 Spec)',
        description: 'P1:(0,7), P2:(2,4), P3:(4,1), P4:(5,4). Exact test specification dataset.',
        processes: [
          { id: 'P1', arrivalTime: 0, burstTime: 7 },
          { id: 'P2', arrivalTime: 2, burstTime: 4 },
          { id: 'P3', arrivalTime: 4, burstTime: 1 },
          { id: 'P4', arrivalTime: 5, burstTime: 4 },
        ]
      },
      {
        id: 'all-arrive-zero',
        name: 'All Arrive at Time Zero',
        description: 'Both Non-Preemptive SJF and SRTF generate the identical optimal order.',
        processes: [
          { id: 'P1', arrivalTime: 0, burstTime: 8 },
          { id: 'P2', arrivalTime: 0, burstTime: 4 },
          { id: 'P3', arrivalTime: 0, burstTime: 2 },
          { id: 'P4', arrivalTime: 0, burstTime: 6 },
        ]
      },
      {
        id: 'cpu-idle-gaps',
        name: 'CPU Idle Interval Gaps',
        description: 'Large gaps in arrival times triggering CPU idle periods.',
        processes: [
          { id: 'P1', arrivalTime: 1, burstTime: 3 },
          { id: 'P2', arrivalTime: 6, burstTime: 2 },
          { id: 'P3', arrivalTime: 10, burstTime: 4 },
        ]
      },
      {
        id: 'heavy-preemption',
        name: 'Frequent Preemption Chain',
        description: 'Successively shorter tasks arrive, triggering a chain of preemptions.',
        processes: [
          { id: 'P1', arrivalTime: 0, burstTime: 10 },
          { id: 'P2', arrivalTime: 2, burstTime: 6 },
          { id: 'P3', arrivalTime: 4, burstTime: 3 },
          { id: 'P4', arrivalTime: 6, burstTime: 1 },
        ]
      },
      {
        id: 'equal-burst-ties',
        name: 'Equal Burst Tie-Breaker',
        description: 'Identical burst times demonstrating arrival time and PID tie-breaking.',
        processes: [
          { id: 'P1', arrivalTime: 0, burstTime: 4 },
          { id: 'P2', arrivalTime: 1, burstTime: 3 },
          { id: 'P3', arrivalTime: 2, burstTime: 3 },
          { id: 'P4', arrivalTime: 3, burstTime: 3 },
        ]
      }
    ];

    function normalizeProcesses(raw) {
      return raw.map((p, idx) => ({
        id: String(p.id).trim(),
        arrivalTime: Math.max(0, parseInt(p.arrivalTime, 10) || 0),
        burstTime: Math.max(1, parseInt(p.burstTime, 10) || 1),
        color: getProcColor(idx)
      }));
    }

    // ==========================================
    // 4. SJF SCHEDULING ALGORITHMS
    // ==========================================
    // 4A. SJF Non-Preemptive
    function solveNonPreemptiveSJF(rawProcesses) {
      const processes = normalizeProcesses(rawProcesses);
      if (processes.length === 0) return { results: [], gantt: [], steps: [], metrics: {} };

      const uncompleted = processes.map(p => ({
        ...p,
        remainingTime: p.burstTime,
        completed: false,
        firstStartTime: null,
        completionTime: null,
        turnaroundTime: null,
        waitingTime: null,
        responseTime: null
      }));

      const gantt = [];
      const unitTimeline = [];
      let currentTime = 0;
      let completedCount = 0;
      const n = uncompleted.length;

      while (completedCount < n) {
        const ready = uncompleted.filter(p => !p.completed && p.arrivalTime <= currentTime);
        if (ready.length === 0) {
          const nextArrival = Math.min(...uncompleted.filter(p => !p.completed).map(p => p.arrivalTime));
          for (let t = currentTime; t < nextArrival; t++) {
            unitTimeline.push({ time: t, activeProcessId: null, isIdle: true });
          }
          gantt.push({
            type: 'idle',
            id: 'IDLE',
            start: currentTime,
            end: nextArrival,
            duration: nextArrival - currentTime,
            color: { bg: '#475569', border: '#334155' }
          });
          currentTime = nextArrival;
          continue;
        }

        ready.sort((a, b) => {
          if (a.burstTime !== b.burstTime) return a.burstTime - b.burstTime;
          if (a.arrivalTime !== b.arrivalTime) return a.arrivalTime - b.arrivalTime;
          return a.id.localeCompare(b.id, undefined, { numeric: true });
        });

        const selected = ready[0];
        const start = currentTime;
        const end = currentTime + selected.burstTime;

        selected.firstStartTime = start;
        selected.completionTime = end;
        selected.turnaroundTime = selected.completionTime - selected.arrivalTime;
        selected.waitingTime = selected.turnaroundTime - selected.burstTime;
        selected.responseTime = selected.firstStartTime - selected.arrivalTime;
        selected.completed = true;

        for (let t = start; t < end; t++) {
          unitTimeline.push({ time: t, activeProcessId: selected.id, isIdle: false });
        }

        gantt.push({
          type: 'process',
          id: selected.id,
          start,
          end,
          duration: selected.burstTime,
          color: selected.color
        });

        currentTime = end;
        completedCount++;
      }

      const totalExecutionTime = currentTime;
      const totalBusyTime = processes.reduce((acc, p) => acc + p.burstTime, 0);
      const idleTime = Math.max(0, totalExecutionTime - totalBusyTime);
      const cpuUtilization = totalExecutionTime > 0 ? (totalBusyTime / totalExecutionTime) * 100 : 0;
      const throughput = totalExecutionTime > 0 ? n / totalExecutionTime : 0;

      const avgWaitingTime = uncompleted.reduce((acc, p) => acc + p.waitingTime, 0) / n;
      const avgTurnaroundTime = uncompleted.reduce((acc, p) => acc + p.turnaroundTime, 0) / n;
      const avgResponseTime = uncompleted.reduce((acc, p) => acc + p.responseTime, 0) / n;

      const steps = generateSteps(processes, unitTimeline, 'non-preemptive');

      return {
        results: uncompleted,
        gantt,
        steps,
        metrics: {
          avgWaitingTime,
          avgTurnaroundTime,
          avgResponseTime,
          totalExecutionTime,
          cpuUtilization,
          throughput,
          totalBusyTime,
          idleTime,
          preemptionCount: 0
        }
      };
    }

    // 4B. SJF Preemptive (SRTF)
    function solvePreemptiveSRTF(rawProcesses) {
      const processes = normalizeProcesses(rawProcesses);
      if (processes.length === 0) return { results: [], gantt: [], steps: [], metrics: {} };

      const procMap = new Map();
      processes.forEach(p => {
        procMap.set(p.id, {
          ...p,
          remainingTime: p.burstTime,
          completed: false,
          firstStartTime: null,
          completionTime: null,
          turnaroundTime: null,
          waitingTime: null,
          responseTime: null
        });
      });

      const unitTimeline = [];
      let currentTime = 0;
      let completedCount = 0;
      const n = processes.length;
      let currentRunningId = null;
      let preemptionCount = 0;

      while (completedCount < n) {
        const ready = Array.from(procMap.values()).filter(p => !p.completed && p.arrivalTime <= currentTime);
        if (ready.length === 0) {
          unitTimeline.push({ time: currentTime, activeProcessId: null, isIdle: true });
          currentTime++;
          currentRunningId = null;
          continue;
        }

        ready.sort((a, b) => {
          if (a.remainingTime !== b.remainingTime) return a.remainingTime - b.remainingTime;
          if (a.id === currentRunningId) return -1;
          if (b.id === currentRunningId) return 1;
          if (a.arrivalTime !== b.arrivalTime) return a.arrivalTime - b.arrivalTime;
          return a.id.localeCompare(b.id, undefined, { numeric: true });
        });

        const chosen = ready[0];
        let isPreempted = false;

        if (currentRunningId !== null && currentRunningId !== chosen.id) {
          const prev = procMap.get(currentRunningId);
          if (prev && !prev.completed && prev.remainingTime > 0) {
            preemptionCount++;
            isPreempted = true;
          }
        }

        if (chosen.firstStartTime === null) {
          chosen.firstStartTime = currentTime;
        }

        currentRunningId = chosen.id;

        unitTimeline.push({
          time: currentTime,
          activeProcessId: chosen.id,
          isIdle: false,
          isPreempted
        });

        chosen.remainingTime -= 1;
        currentTime += 1;

        if (chosen.remainingTime === 0) {
          chosen.completed = true;
          chosen.completionTime = currentTime;
          chosen.turnaroundTime = chosen.completionTime - chosen.arrivalTime;
          chosen.waitingTime = chosen.turnaroundTime - chosen.burstTime;
          chosen.responseTime = chosen.firstStartTime - chosen.arrivalTime;
          completedCount++;
          currentRunningId = null;
        }
      }

      // Consolidate into Gantt blocks
      const gantt = [];
      if (unitTimeline.length > 0) {
        let cur = {
          type: unitTimeline[0].isIdle ? 'idle' : 'process',
          id: unitTimeline[0].isIdle ? 'IDLE' : unitTimeline[0].activeProcessId,
          start: unitTimeline[0].time,
          end: unitTimeline[0].time + 1,
          duration: 1,
          isPreempted: unitTimeline[0].isPreempted || false,
          color: unitTimeline[0].isIdle ? { bg: '#475569', border: '#334155' } : procMap.get(unitTimeline[0].activeProcessId).color
        };

        for (let i = 1; i < unitTimeline.length; i++) {
          const u = unitTimeline[i];
          const match = u.isIdle ? cur.type === 'idle' : (cur.type === 'process' && cur.id === u.activeProcessId);
          if (match) {
            cur.end = u.time + 1;
            cur.duration = cur.end - cur.start;
          } else {
            gantt.push({ ...cur });
            cur = {
              type: u.isIdle ? 'idle' : 'process',
              id: u.isIdle ? 'IDLE' : u.activeProcessId,
              start: u.time,
              end: u.time + 1,
              duration: 1,
              isPreempted: u.isPreempted || false,
              color: u.isIdle ? { bg: '#475569', border: '#334155' } : procMap.get(u.activeProcessId).color
            };
          }
        }
        gantt.push(cur);
      }

      const totalExecutionTime = currentTime;
      const totalBusyTime = processes.reduce((acc, p) => acc + p.burstTime, 0);
      const idleTime = Math.max(0, totalExecutionTime - totalBusyTime);
      const cpuUtilization = totalExecutionTime > 0 ? (totalBusyTime / totalExecutionTime) * 100 : 0;
      const throughput = totalExecutionTime > 0 ? n / totalExecutionTime : 0;

      const results = processes.map(p => procMap.get(p.id));
      const avgWaitingTime = results.reduce((acc, p) => acc + p.waitingTime, 0) / n;
      const avgTurnaroundTime = results.reduce((acc, p) => acc + p.turnaroundTime, 0) / n;
      const avgResponseTime = results.reduce((acc, p) => acc + p.responseTime, 0) / n;

      const steps = generateSteps(processes, unitTimeline, 'preemptive');

      return {
        results,
        gantt,
        steps,
        metrics: {
          avgWaitingTime,
          avgTurnaroundTime,
          avgResponseTime,
          totalExecutionTime,
          cpuUtilization,
          throughput,
          totalBusyTime,
          idleTime,
          preemptionCount
        }
      };
    }

    // Generate step snapshots for playback & learning
    function generateSteps(initialProcesses, unitTimeline, algorithmType) {
      const steps = [];
      const procStatus = new Map();
      initialProcesses.forEach(p => {
        procStatus.set(p.id, {
          id: p.id,
          arrivalTime: p.arrivalTime,
          burstTime: p.burstTime,
          remainingTime: p.burstTime,
          color: p.color,
          state: 'not-arrived',
          firstStart: null,
          completionTime: null
        });
      });

      const initialReady = [];
      procStatus.forEach(p => {
        if (p.arrivalTime === 0) {
          p.state = 'ready';
          initialReady.push({ ...p });
        }
      });

      steps.push({
        time: 0,
        activeProcess: null,
        readyQueue: initialReady.map(p => ({ ...p })),
        completedList: [],
        explanation: `Time 0: Initial state. Arrived at T=0: [${initialReady.map(p => p.id).join(', ') || 'None'}]. Scheduler ready.`,
        isIdle: unitTimeline.length > 0 ? unitTimeline[0].isIdle : true,
        preemption: false
      });

      for (let i = 0; i < unitTimeline.length; i++) {
        const unit = unitTimeline[i];
        const t = unit.time;
        const activeId = unit.activeProcessId;
        const isIdle = unit.isIdle;

        procStatus.forEach(p => {
          if (p.arrivalTime === t && p.state === 'not-arrived') {
            p.state = 'ready';
          }
        });

        if (activeId) {
          const act = procStatus.get(activeId);
          if (act.firstStart === null) act.firstStart = t;
          act.state = 'running';
          act.remainingTime = Math.max(0, act.remainingTime - 1);
        }

        const currentReady = [];
        const completedSnapshot = [];

        procStatus.forEach(p => {
          if (p.remainingTime === 0 && (activeId === p.id || p.state === 'completed')) {
            p.state = 'completed';
            if (!p.completionTime) p.completionTime = t + 1;
            completedSnapshot.push({ ...p });
          } else if (p.arrivalTime <= (t + 1) && p.remainingTime > 0) {
            if (p.id !== activeId) p.state = 'ready';
            currentReady.push({ ...p });
          }
        });

        if (algorithmType === 'preemptive') {
          currentReady.sort((a, b) => a.remainingTime - b.remainingTime || a.arrivalTime - b.arrivalTime);
        } else {
          currentReady.sort((a, b) => a.burstTime - b.burstTime || a.arrivalTime - b.arrivalTime);
        }

        const activeObj = activeId ? procStatus.get(activeId) : null;
        let explanation = '';
        if (isIdle) {
          explanation = `Time ${t} → ${t + 1}: CPU is IDLE. Ready Queue has no available jobs.`;
        } else if (algorithmType === 'preemptive') {
          if (unit.isPreempted) {
            explanation = `Time ${t}: ⚡ PREEMPTION! ${activeId} arrived with remaining burst ${activeObj.remainingTime + 1}, interrupting currently running task.`;
          } else if (activeObj.remainingTime === 0) {
            explanation = `Time ${t} → ${t + 1}: ${activeId} finishes its execution at time ${t + 1}.`;
          } else {
            explanation = `Time ${t} → ${t + 1}: ${activeId} executing on CPU (remaining burst: ${activeObj.remainingTime} units).`;
          }
        } else {
          if (activeObj.remainingTime === 0) {
            explanation = `Time ${t} → ${t + 1}: ${activeId} finishes its full ${activeObj.burstTime} burst at time ${t + 1}.`;
          } else {
            explanation = `Time ${t} → ${t + 1}: ${activeId} executing uninterrupted (${activeObj.remainingTime} units remaining).`;
          }
        }

        steps.push({
          time: t + 1,
          activeProcess: activeId ? { ...activeObj } : null,
          readyQueue: currentReady.filter(p => p.id !== activeId),
          completedList: completedSnapshot,
          explanation,
          isIdle,
          preemption: unit.isPreempted || false
        });
      }

      return steps;
    }

    // ==========================================
    // 5. AUTOMATED TEST SUITE (Section 11)
    // ==========================================
    function runVerificationTests() {
      const assertions = [];
      function check(name, pass, details) {
        assertions.push({ name, pass: Boolean(pass), details });
      }

      const benchmark = [
        { id: 'P1', arrivalTime: 0, burstTime: 7 },
        { id: 'P2', arrivalTime: 2, burstTime: 4 },
        { id: 'P3', arrivalTime: 4, burstTime: 1 },
        { id: 'P4', arrivalTime: 5, burstTime: 4 }
      ];

      // Non-Preemptive
      const np = solveNonPreemptiveSJF(benchmark);
      const npSeq = np.gantt.map(g => g.id).join('→');
      check('Non-Preemptive Sequence (P1 → P3 → P2 → P4)', npSeq === 'P1→P3→P2→P4', `Actual: ${npSeq}`);
      check('Non-Preemptive Avg WT == 4', np.metrics.avgWaitingTime === 4, `Actual: ${np.metrics.avgWaitingTime}`);
      check('Non-Preemptive Avg TAT == 8', np.metrics.avgTurnaroundTime === 8, `Actual: ${np.metrics.avgTurnaroundTime}`);

      // Preemptive SRTF
      const p = solvePreemptiveSRTF(benchmark);
      const pGanttSummary = p.gantt.map(g => `${g.id}(${g.start}-${g.end})`).join(', ');
      const pExpected = 'P1(0-2), P2(2-4), P3(4-5), P2(5-7), P4(7-11), P1(11-16)';
      check('Preemptive Gantt Intervals 0-2 P1, 2-4 P2, 4-5 P3, 5-7 P2, 7-11 P4, 11-16 P1', pGanttSummary === pExpected, `Actual: ${pGanttSummary}`);
      check('Preemptive Avg WT == 3', p.metrics.avgWaitingTime === 3, `Actual: ${p.metrics.avgWaitingTime}`);
      check('Preemptive Avg TAT == 7', p.metrics.avgTurnaroundTime === 7, `Actual: ${p.metrics.avgTurnaroundTime}`);

      // Single process offset
      const single = solveNonPreemptiveSJF([{ id: 'P1', arrivalTime: 2, burstTime: 3 }]);
      check('CPU Idle Insertion & Single Process Offset Handling', single.gantt[0].type === 'idle' && single.results[0].completionTime === 5, 'Starts at 2, finishes at 5 with 2 units idle');

      return {
        allPassed: assertions.every(a => a.pass),
        passedCount: assertions.filter(a => a.pass).length,
        total: assertions.length,
        assertions
      };
    }

                          >
                            {b.id} ({b.end - b.start}u)
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* VIEW 4: LEARNING MODE */}
            {/* ========================================================================= */}
            {activeTab === 'learning' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                <div className={`p-8 rounded-3xl border ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-md'} space-y-5`}>
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <IconGraduation className="w-5 h-5 text-cyan-400" />
                        <span>Step-by-Step Learning Log</span>
                      </h2>
                      <p className="text-xs text-slate-400">Chronological explanation of every OS scheduling decision</p>
                    </div>
                    <span className="text-xs font-mono text-cyan-400 font-bold">{steps.length} Steps Logged</span>
                  </div>

                  <div className="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                    {steps.map((st, idx) => (
                      <div key={idx} className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono space-y-1">
                        <div className="flex items-center justify-between text-cyan-400 font-bold">
                          <span>Step {idx} (T = {st.time})</span>
                          {st.preemption && <span className="text-purple-400">⚡ PREEMPTION</span>}
                          {st.isIdle && <span className="text-amber-400">IDLE CYCLE</span>}
                        </div>
                        <p className="text-slate-300 leading-relaxed">{st.explanation}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* VIEW 5: VERIFICATION TESTS */}
            {/* ========================================================================= */}
            {activeTab === 'tests' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                <div className={`p-8 rounded-3xl border ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-md'} space-y-5`}>
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div className="flex items-center gap-2.5">
                      <IconCheckCircle className="w-6 h-6 text-emerald-400" />
                      <div>
                        <h2 className="text-xl font-bold text-white">Section 11 Test Assertion Suite</h2>
                        <p className="text-xs text-slate-400 font-mono">100% compliant with user specification assertions</p>
                      </div>
                    </div>
                    <span className="text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-800 font-mono font-bold">
                      {testResults.passedCount}/{testResults.total} PASSED
                    </span>
                  </div>

                  <div className="space-y-2.5">
                    {testResults.assertions.map((a, idx) => (
                      <div key={idx} className="p-3.5 rounded-2xl bg-slate-950 border border-emerald-900/60 text-xs font-mono space-y-1">
                        <div className="flex items-center gap-2 text-white font-bold">
                          <span className="text-emerald-400">✔</span>
                          <span>{a.name}</span>
                        </div>
                        <div className="text-[11px] text-slate-400 pl-4">{a.details}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="mt-16 border-t border-slate-800/80 bg-[#060912] py-8 text-center text-xs text-slate-500 font-mono space-y-2">
            <div>SJF CPU Scheduling Visualizer | Complete Educational OS Platform</div>
            <div className="text-[11px] text-slate-600">Zero-setup executable HTML application with React 18 & Tailwind CSS</div>
          </footer>

        </div>
      );
    }

    // Mount Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
